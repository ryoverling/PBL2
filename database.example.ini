; Copy to a private location outside the repository and pass its path to the app.
; For local Stage A/B development only, set environment=local-test,
; name=MoneyManager_StageA_Test and trust_server_certificate=true.
; The exception keeps encryption but skips server certificate validation.
[database]
driver=ODBC Driver 18 for SQL Server
; QSettings INI syntax requires a doubled backslash in the server value.
server=.\\SQLEXPRESS
name=MoneyManager_StageA_Test
environment=production
encrypt=true
trust_server_certificate=false
